# Hostinger SSH deploy pipeline for sds-site
#
# Stages:
#   build  — npm ci + vite build, artifacts in dist/
#   deploy — rsync dist/ to Hostinger over SSH on every push to main
#
# Subgroup CI/CD variables consumed (set on shadowdynamicsystems/web):
#   webhost  — Hostinger SSH host (e.g. apollo.hostinger.com)
#   webuser  — SSH username
#   webport  — SSH port (optional; defaults to 22)
#   webkey   — SSH private key. Recommended type: File (then $webkey is a path).
#              If type Variable, the PEM content is written to a temp file at runtime.
#
# Project-level CI/CD variable required (set on this project):
#   DEPLOY_PATH — absolute path on the Hostinger host that should receive dist/.
#                 Example: /home/$webuser/domains/shadowdynamic.systems/public_html
#
# Project-level CI/CD variable optional:
#   PUBLIC_URL  — public URL surfaced on the GitLab environment card.
#
# Notes:
#   - rsync runs WITHOUT --delete so server-side files (contact form PHP, .htaccess
#     written by Hostinger, etc.) are preserved. Add an exclude file if you later
#     want strict mirror semantics.
#   - Host key is captured via ssh-keyscan on first run (TOFU). For stricter
#     verification, add the host's public key to a SSH_KNOWN_HOSTS variable.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

default:
  image: node:${NODE_VERSION}-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$webkey" ]; then
        cp "$webkey" ~/.ssh/id_deploy
      else
        printf '%s\n' "$webkey" > ~/.ssh/id_deploy
      fi
    - chmod 600 ~/.ssh/id_deploy
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${webport:-22}" "$webhost" >> ~/.ssh/known_hosts 2>/dev/null
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - test -n "$webhost"     || { echo "webhost not set (subgroup variable)"; exit 1; }
    - test -n "$webuser"     || { echo "webuser not set (subgroup variable)"; exit 1; }
    - test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH not set (project variable)"; exit 1; }
    - >-
      rsync -az --human-readable --stats
      -e "ssh -i ~/.ssh/id_deploy -p ${webport:-22} -o StrictHostKeyChecking=yes"
      dist/ "$webuser@$webhost:$DEPLOY_PATH/"
  environment:
    name: production/sds-site
    url: ${PUBLIC_URL}
