# Hostinger SSH deploy pipeline for sds-site
#
# Stages:
#   build  — npm ci + vite build, artifacts in dist/
#   deploy — inject contact API DB settings, then rsync dist/ to Hostinger
#
# Subgroup CI/CD variables consumed:
#   webhost  — Hostinger SSH host
#   webuser  — SSH username
#   webport  — SSH port (optional; defaults to 22)
#   webkey   — SSH private key
#   dbname   — contact form database name
#   dbuser   — contact form database user
#   dbpass   — contact form database password
#
# Project-level CI/CD variable required:
#   DEPLOY_PATH — absolute path on the Hostinger host that should receive dist/
#
# Project-level CI/CD variable optional:
#   PUBLIC_URL  — public URL surfaced on the GitLab environment card.

stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

default:
  image: node:${NODE_VERSION}-alpine
  tags:
    - docker

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache gettext openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$webkey" ]; then
        cp "$webkey" ~/.ssh/id_deploy
      else
        printf '%s\n' "$webkey" > ~/.ssh/id_deploy
      fi
    - chmod 600 ~/.ssh/id_deploy
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      else
        ssh-keyscan -p "${webport:-22}" "$webhost" >> ~/.ssh/known_hosts 2>/dev/null
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - test -n "$webhost"     || { echo "webhost not set (subgroup variable)"; exit 1; }
    - test -n "$webuser"     || { echo "webuser not set (subgroup variable)"; exit 1; }
    - test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH not set (project variable)"; exit 1; }
    - test -n "$dbname"      || { echo "dbname not set (subgroup variable)"; exit 1; }
    - test -n "$dbuser"      || { echo "dbuser not set (subgroup variable)"; exit 1; }
    - test -n "$dbpass"      || { echo "dbpass not set (subgroup variable)"; exit 1; }
    - test -f dist/api/contact.php || { echo "dist/api/contact.php missing"; exit 1; }
    - export dbname_b64="$(printf '%s' "$dbname" | base64 | tr -d '\n')"
    - export dbuser_b64="$(printf '%s' "$dbuser" | base64 | tr -d '\n')"
    - export dbpass_b64="$(printf '%s' "$dbpass" | base64 | tr -d '\n')"
    - envsubst '${dbname_b64} ${dbuser_b64} ${dbpass_b64}' < dist/api/contact.php > dist/api/contact.php.tmp
    - mv dist/api/contact.php.tmp dist/api/contact.php
    - >-
      rsync -az --human-readable --stats
      -e "ssh -i ~/.ssh/id_deploy -p ${webport:-22} -o StrictHostKeyChecking=yes"
      dist/ "$webuser@$webhost:$DEPLOY_PATH/"
  environment:
    name: production/sds-site
    url: ${PUBLIC_URL}
